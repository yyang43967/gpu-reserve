name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets the end-to-end job run on any branch by hand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # tiktoken downloads its encoding on first use. Tests cannot reach the network, so
      # the encoding is fetched before pytest, as the image does at build time.
      TIKTOKEN_CACHE_DIR: /home/runner/.cache/tiktoken
      TIKTOKEN_ENCODING: cl100k_base
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Read the locked tiktoken version
        id: tiktoken
        run: |
          version=$(grep -A1 '^name = "tiktoken"$' uv.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the tiktoken encoding
        uses: actions/cache@v6
        with:
          path: ${{ env.TIKTOKEN_CACHE_DIR }}
          key: tiktoken-${{ steps.tiktoken.outputs.version }}-${{ env.TIKTOKEN_ENCODING }}

      - name: Fetch the tiktoken encoding
        run: uv run python -c "import os, tiktoken; tiktoken.get_encoding(os.environ['TIKTOKEN_ENCODING'])"

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Test (unit and integration)
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
          # Plain stdout/stderr; the wrapper only matters for reading outputs in steps.
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -recursive -check

      # No credentials and no backend: validate checks syntax, types, and references only.
      - name: Validate
        run: |
          for dir in $(find . -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  deploy-scripts:
    name: Deploy scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # A pinned shellcheck image, the same one local runs use (not the runner's own).
      - name: Shellcheck
        run: bash infra/deploy/tests/shellcheck.sh

      - name: Test deploy.sh
        run: bash infra/deploy/tests/deploy-test.sh

      # Real systemd on the runner: a failed backup must start the alert unit.
      - name: Test the backup failure alert
        run: sudo bash infra/deploy/tests/alert-test.sh

  image-and-smoke:
    name: ARM64 image and stack smoke test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [backend, frontend]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Base file only: no override, so the api runs the built image without reload.
      - name: Start core stack
        run: docker compose -f docker-compose.yml --profile core up -d --build --wait --wait-timeout 180

      # Runs inside the built image, which proves it ships the migrations.
      - name: Apply migrations
        run: docker compose -f docker-compose.yml --profile core run --rm --no-deps api alembic upgrade head

      - name: Check schema version
        run: |
          version="$(docker compose -f docker-compose.yml --profile core exec -T postgres \
            psql -U gpureserve -d gpureserve -tAc 'SELECT version_num FROM alembic_version')"
          head="$(docker compose -f docker-compose.yml --profile core run --rm --no-deps api \
            alembic heads | cut -d' ' -f1)"
          echo "Schema version: $version, migration head: $head"
          test -n "$head" && test "$version" = "$head"

      - name: Check image architecture
        run: test "$(docker image inspect gpu-reserve-api:local --format '{{.Architecture}}')" = "arm64"

      - name: Smoke test
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health
          echo
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/ready
          echo

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml --profile core logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml --profile core down -v

  e2e:
    name: End-to-end (Playwright)
    # Main only, like the image job, to keep pull requests fast; runnable by hand.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Start the end-to-end stack
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait --wait-timeout 180

      - name: Run Playwright
        working-directory: frontend
        run: pnpm exec playwright test

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

