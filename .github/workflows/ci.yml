name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Test (unit and integration)
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  image-and-smoke:
    name: ARM64 image and stack smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Base file only: no override, so the api runs the built image without reload.
      - name: Start core stack
        run: docker compose -f docker-compose.yml --profile core up -d --build --wait --wait-timeout 180

      - name: Check image architecture
        run: test "$(docker image inspect gpu-reserve-api:local --format '{{.Architecture}}')" = "arm64"

      - name: Smoke test
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health
          echo
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/ready
          echo

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml --profile core logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml --profile core down -v
